<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="./index.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Generate a <span id="highlight-text">random password</span></h1>
    <p class="subtitle">Never use an <span id="strike-through">in</span>secure password again.</p>
    <div class="slide-container">
        <p id="slider-value"></p>
        <input type="range" min="6" max="20" value="12" class="slider" id="length-slider" oninput="updateLengthValue(this.value)">
    </div>
    <div class="checkbox-container">
        <p>Characters Used</p>
        <label><input type="checkbox" id="include-uppercase" checked>Uppercase</label>
        <label><input type="checkbox" id="include-numbers" checked>Numbers</label>
        <label><input type="checkbox" id="include-symbols" checked>Symbols</label>
    </div>
    <button id="generate-btn" onclick="renderPasswords()">Generate Passwords</button>
    <hr>
    <div class="passwords-container">
        <div class="left-column">
            <p id="password1" class="password-box"></p>
            <button class="copy-btn" onclick="copyToClipboard('password1')" aria-label="Copy password">
                <span class="copy-text" id="password1-copy">📋</span>
            </button>
        </div>
        <div class="right-column">
            <p id="password2" class="password-box"> </p>
            <button class="copy-btn" onclick="copyToClipboard('password2')" aria-label="Copy password">
                <span class="copy-text" id="password2-copy">📋</span>
            </button>
        </div>
    </div>
    </div>
    
</body>
</html>
